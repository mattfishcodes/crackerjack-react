name: Build and deploy static site

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - run: pnpm install
      - run: pnpm build

      - name: Deploy to prod repo (preserve history)
        run: |
          git clone https://nuggsrocks:${{ secrets.DEPLOY_TOKEN }}@github.com/nuggsrocks/crackerjack-solutions-siteground.git prod

          rsync -av --delete out/ prod/

          cd prod
          git config user.name "deploy-bot"
          git config user.email "deploy@bot.com"

          git add .
          git commit -m "Deploy $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"
          git push origin main
