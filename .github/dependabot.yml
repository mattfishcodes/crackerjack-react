version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '11:45'

    # Reduce PR spam
    open-pull-requests-limit: 5

    groups:
      # Framework-level updates (review carefully)
      framework:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'

      # Dev tools
      dev-dependencies:
        dependency-type: 'development'

      # Everything else
      runtime-dependencies:
        dependency-type: 'production'
